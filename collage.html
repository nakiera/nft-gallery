<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>nakiera Instagram Collage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #05070a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    /* 1:1 Instagram Kare Post Boyutu (1080x1080 ölçeği) */
    .instagram-canvas {
      width: 600px;
      height: 600px;
      background-color: #0b0e14;
      border: 1px solid #222936;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Üst Başlık & Marka */
    .collage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      z-index: 2;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f0f6fc;
      letter-spacing: -0.5px;
    }

    .brand-tag {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #58a6ff;
      font-size: 0.95rem;
    }

    /* Kolaj Izgarası */
    .collage-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      z-index: 2;
    }

    .frame {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background-color: #141922;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Sol Ana Büyük Resim (Ayçiçeği) */
    .frame-main {
      grid-row: span 2;
    }

    .tag-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(11, 14, 20, 0.75);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Alt Bilgi Şeridi */
    .collage-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #1f2633;
      z-index: 2;
    }

    .footer-left {
      color: #8b949e;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .footer-right {
      color: #f0f6fc;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1f293d;
      padding: 4px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="instagram-canvas">
    
    <!-- Başlık -->
    <div class="collage-header">
      <div class="brand-title">NAKIERA ART</div>
      <div class="brand-tag">Original Fine Art & NFT Series</div>
    </div>

    <!-- 3'lü Dinamik Kolaj Izgarası -->
    <div class="collage-grid">
      <!-- 1. Büyük Ana Tablo: Ayçiçeği -->
      <div class="frame frame-main">
        <img src="images/sunflower2.jpg" alt="Sunflower" />
        <span class="tag-overlay">nakiera Collection</span>
      </div>

      <!-- 2. Sağ Üst: Karakalem Gül -->
      <div class="frame">
        <img src="images/rose2.jpg" alt="Charcoal Rose" />
        <span class="tag-overlay">black and white</span>
      </div>

      <!-- 3. Sağ Alt: Nostaljik Bisiklet -->
      <div class="frame">
        <img src="images/bycycle1.jpg" alt="Bicycle" />
        <span class="tag-overlay">ZO paintings</span>
      </div>
    </div>

    <!-- Alt Şerit -->
    <div class="collage-footer">
      <span class="footer-left">Ethereum Verified &bull; nakiera.github.io/nft-gallery/</span>
      <span class="footer-right">Open for Offers</span>
    </div>

  </div>

</body>
</html>
