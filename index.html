<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep Özçelik Art Gallery | zo & nakiera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; padding: 40px 20px; }
        
        header { text-align: center; margin-bottom: 35px; }
        h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 8px; letter-spacing: 0.5px; }
        p.desc { color: #94a3b8; font-size: 1rem; max-width: 650px; margin: 0 auto; line-height: 1.5; }

        /* Filtre Butonları */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .filter-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        /* Galeri Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
            max-width: 1250px;
            margin: 0 auto;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
        }

        .img-box {
            width: 100%;
            height: 270px;
            background: #0f172a;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .img-box img {
            transform: scale(1.04);
        }

        .info {
            padding: 14px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .category-tag {
            font-size: 0.8rem;
            color: #38bdf8;
            margin: 3px 0 14px 0;
        }

        .btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            text-decoration: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Art & Creation Gallery</h1>
        <p class="desc">Original paintings, charcoal sketches, handmade jewelry, and crafted designs by Zeynep Özçelik.</p>
    </header>

    <!-- Kategori Filtreleri -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterGallery('all')">All Works</button>
        <button class="filter-btn" onclick="filterGallery('paintings')">Paintings & Canvas</button>
        <button class="filter-btn" onclick="filterGallery('bw')">Black & White (Charcoal)</button>
        <button class="filter-btn" onclick="filterGallery('jewelry')">Handmade Jewelry</button>
        <button class="filter-btn" onclick="filterGallery('bags')">Craft & Bags</button>
    </div>

    <!-- Galeri Grid -->
    <div class="gallery" id="gallery-grid"></div>

    <footer>
        <p>© 2026 Zeynep Özçelik | nakiera & zo Art</p>
    </footer>

    <script>
        // Eser Veritabanı
        const artworks = [
            // Black & White (Karakalem / Mürekkep)
            { title: "Bust", category: "bw", catName: "Black & White by zo", file: "bust1.jpg" },
            { title: "Lighthouse", category: "bw", catName: "Black & White by zo", file: "lighthouse1.jpg" },
            { title: "Lilies", category: "bw", catName: "Black & White by zo", file: "lilies4.jpg" },
            { title: "Rose Study I", category: "bw", catName: "Black & White by zo", file: "rose1.jpg" },
            { title: "Rose Study II", category: "bw", catName: "Black & White by zo", file: "rose2.jpg" },
            { title: "Roses in Vase", category: "bw", catName: "Black & White by zo", file: "roses3.jpg" },
            { title: "Ink Flower", category: "bw", catName: "Black & White by zo", file: "inkflower1.jpg" },

            // Paintings (Renkli Çizimler / Tuval)
            { title: "Sunflower Field", category: "paintings", catName: "nakiera Collection", file: "sunflower2.jpg" },
            { title: "Sunflower Study", category: "paintings", catName: "nakiera Collection", file: "sunflower6-11-23.jpg" },
            { title: "Still Life Wine & Grapes", category: "paintings", catName: "nakiera Collection", file: "wine1.jpg" },
            { title: "Red Poppies I", category: "paintings", catName: "nakiera Collection", file: "poppies4.jpg" },
            { title: "Red Poppies II", category: "paintings", catName: "nakiera Collection", file: "poppy1.jpg" },
            { title: "Red Poppies III", category: "paintings", catName: "nakiera Collection", file: "poppy2.jpg" },
            { title: "Red Poppies IV", category: "paintings", catName: "nakiera Collection", file: "poppy3.jpg" },
            { title: "Purple Lilies", category: "paintings", catName: "nakiera Collection", file: "lilies1.jpg" },
            { title: "Tulips in Spring", category: "paintings", catName: "nakiera Collection", file: "tulip1.jpg" },
            { title: "Pink Tulips", category: "paintings", catName: "nakiera Collection", file: "tulip2.jpg" },
            { title: "Tulip Harmony", category: "paintings", catName: "nakiera Collection", file: "tulip3.jpg" },
            { title: "Spring Bicycle", category: "paintings", catName: "nakiera Collection", file: "bycycle1.jpg" },
            { title: "Hot Air Balloons", category: "paintings", catName: "nakiera Collection", file: "baloon10-11-23.jpg" },
            { title: "Blue Flower", category: "paintings", catName: "nakiera Collection", file: "bflower07-11-23.jpg" },
            { title: "Abstract Color Wave", category: "paintings", catName: "nakiera Collection", file: "color12-11-23.jpg" },
            { title: "Daisies in Vase", category: "paintings", catName: "nakiera Collection", file: "daisies.jpg" },
            { title: "Dandelion Breeze", category: "paintings", catName: "nakiera Collection", file: "dandelion1.jpg" },
            { title: "White Flowers", category: "paintings", catName: "nakiera Collection", file: "flower11-11-23.jpg" },
            { title: "Seashell on Canvas", category: "paintings", catName: "nakiera Collection", file: "seashell08-11-23.jpg" },
            { title: "Strawberry Garden", category: "paintings", catName: "nakiera Collection", file: "straw07-11-23.jpg" },

            // Takı / Aksesuar
            { title: "Handmade Beaded Bracelet I", category: "jewelry", catName: "Handmade Jewelry", file: "DSC00894.jpg" },
            { title: "Handmade Beaded Bracelet II", category: "jewelry", catName: "Handmade Jewelry", file: "DSC00895.jpg" },
            { title: "Turquoise Stone Bracelet", category: "jewelry", catName: "Handmade Jewelry", file: "DSC00896.jpg" },
            { title: "Floral Beaded Charms", category: "jewelry", catName: "Handmade Jewelry", file: "DSC00904.jpg" },
            { title: "Flower Motif Accessories", category: "jewelry", catName: "Handmade Jewelry", file: "DSC00907.jpg" },

            // Çantalar
            { title: "Lace Decorated Tote Bag I", category: "bags", catName: "Craft & Bags", file: "DSC00889.jpg" },
            { title: "Lace Decorated Tote Bag II", category: "bags", catName: "Craft & Bags", file: "DSC00890.jpg" },
            { title: "Custom Embroidered Bag", category: "bags", catName: "Craft & Bags", file: "DSC00893.jpg" }
        ];

        function renderGallery(items) {
            const grid = document.getElementById("gallery-grid");
            grid.innerHTML = "";
            items.forEach(art => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="img-box">
                            <img src="images/${art.file}" alt="${art.title}" loading="lazy" onerror="this.onerror=null; this.src='images/${art.file.replace('.jpg','.png')}';">
                        </div>
                        <div class="info">
                            <div>
                                <div class="title">${art.title}</div>
                                <div class="category-tag">${art.catName}</div>
                            </div>
                            <a href="https://opensea.io" target="_blank" class="btn">View Details</a>
                        </div>
                    </div>
                `;
            });
        }

        function filterGallery(category) {
            // Buton aktiflik sınıflarını güncelle
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderGallery(artworks);
            } else {
                const filtered = artworks.filter(a => a.category === category);
                renderGallery(filtered);
            }
        }

        // İlk açılışta hepsini listele
        renderGallery(artworks);
    </script>
</body>
</html>
